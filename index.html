<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorite Streamer Voting</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0e0e10;
      color: #efeff1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 {
      color: #a970ff;
    }
    .card-container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .card {
      background-color: #18181b;
      border: 1px solid #303032;
      border-radius: 8px;
      padding: 20px;
      width: 200px;
      text-align: center;
    }
    button {
      background-color: #9146ff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      background-color: #772ce8;
    }
    .vote-count {
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <h1>Vote for Your Favorite Streamer</h1>
  <p>Select a streamer below to cast your vote!</p>

  <div class="card-container">
    <div class="card">
      <h2>Streamer 1</h2>
      <div class="vote-count" id="count-1">0</div>
      <button onclick="addVote('count-1')">Vote</button>
    </div>

    <div class="card">
      <h2>Streamer 2</h2>
      <div class="vote-count" id="count-2">0</div>
      <button onclick="addVote('count-2')">Vote</button>
    </div>

    <div class="card">
      <h2>Streamer 3</h2>
      <div class="vote-count" id="count-3">0</div>
      <button onclick="addVote('count-3')">Vote</button>
    </div>
  </div>

  <script>
    function addVote(id) {
      const countElement = document.getElementById(id);
      let currentVotes = parseInt(countElement.innerText);
      countElement.innerText = currentVotes + 1;
    }
  </script>

</body>
</html>
